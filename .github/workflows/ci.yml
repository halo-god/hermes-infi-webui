# PR 时自动运行：lint + type-check + 单元测试（含覆盖率硬门槛）+ E2E + 安全扫描
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── 安全扫描 ──
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install -e .
          pip-audit --require-hashes false --progress-spinner off

  # ── 后端检查（覆盖率 ≥60% 硬门槛）──
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hermes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Verify config catalog freshness
        # Regenerate docs/配置目录.md from app/config.py and diff — the doc
        # can never drift from the settings schema (borrowed from the
        # generated-docs loop popularized by agent frameworks like dsh).
        working-directory: backend
        run: |
          python scripts/gen_config_catalog.py
          git diff --exit-code -- ../docs/配置目录.md

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://hermes:test@localhost:5432/hermes_test
          REDIS_URL: redis://localhost:6379
        run: alembic upgrade head

      - name: Seed super-admin
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://hermes:test@localhost:5432/hermes_test
          REDIS_URL: redis://localhost:6379
          FIRST_ADMIN_PASSWORD: ci-test-password-not-secret
        run: python -m app.seed

      - name: Run tests (coverage gate ≥60%)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://hermes:test@localhost:5432/hermes_test
          REDIS_URL: redis://localhost:6379
          FIRST_ADMIN_PASSWORD: ci-test-password-not-secret
          # Tests share one Redis for the whole run and log in as the same admin
          # many times; the per-IP login guard (default 10/min) would trip a 429.
          LOGIN_RATE_LIMIT_PER_MIN: "100000"
        run: pytest -x -q --cov-fail-under=60 --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ── 前端检查（覆盖率 ≥40% 硬门槛，vite.config.ts thresholds）──
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests (vitest + coverage gate)
        working-directory: frontend
        run: npm test -- --coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ── E2E（真实全栈；排除 @real-agent 用例——流式回复需 ACP runner，
  #    本地带 runner 时用 `npx playwright test` 全量跑）──
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hermes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrate + seed (E2E admin credentials)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://hermes:test@localhost:5432/hermes_test
          REDIS_URL: redis://localhost:6379
          # Must match e2e/helpers.ts ADMIN_PASSWORD.
          FIRST_ADMIN_PASSWORD: Hermes@2026
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Start API (uvicorn :8001)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://hermes:test@localhost:5432/hermes_test
          REDIS_URL: redis://localhost:6379
          FIRST_ADMIN_PASSWORD: Hermes@2026
          LOGIN_RATE_LIMIT_PER_MIN: "100000"
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8001 --log-level warning > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:8001/api/v1/healthz && exit 0 || sleep 2
          done
          echo "API did not become ready"; tail -50 /tmp/api.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build (proxy target = CI API)
        working-directory: frontend
        env:
          VITE_API_PROXY_TARGET: http://localhost:8001
        run: npm run build

      - name: Serve built frontend (vite preview :5173)
        working-directory: frontend
        run: |
          nohup npx vite preview --port 5173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:5173 && exit 0 || sleep 2
          done
          echo "Frontend did not become ready"; tail -50 /tmp/preview.log; exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E (CI subset, real-agent excluded)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8001
        run: npx playwright test --grep-invert @real-agent

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: frontend/playwright-report/
          retention-days: 7
